name: Build Android app

on:
  push:
    paths:
      - 'android/**'
      - '.github/workflows/android.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android-build
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build APK
        working-directory: android
        run: gradle assembleRelease --no-daemon --stacktrace

      - name: Publish to the "app-latest" release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp android/app/build/outputs/apk/release/app-release.apk notes.apk
          gh release delete app-latest --yes --cleanup-tag || true
          gh release create app-latest notes.apk \
            --title "笔记 App（第 ${{ github.run_number }} 次构建）" \
            --notes "在手机浏览器打开下面的 notes.apk 下载并安装。每次更新代码都会自动重新构建，新版本直接覆盖安装即可，笔记和设置会保留。" \
            --latest
